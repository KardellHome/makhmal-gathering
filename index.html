<style>
*,*::before,*::after{box-sizing:border-box}
html{background:#45452f;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#45452f;color:#efe8da;font-family:"Vazirmatn","IRANSansX","IRANSans","Segoe UI",Tahoma,system-ui,sans-serif}
.mk{display:flex;justify-content:center}
.mk-col{width:100%;max-width:520px;background:#45452f;container-type:inline-size;box-shadow:0 0 80px rgba(0,0,0,.28)}
.mk-col img{display:block;width:100%;height:auto}
.mk-form{margin:0;background:#efe8da}
.mk-rsvp{position:relative}
.mk-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mk-set{margin:0;padding:0;border:0;min-width:0}
.mk-name{position:absolute;margin:0;padding:0 4%;border:0;border-radius:0;background:transparent;color:#253d30;font-family:inherit;font-size:16px;font-size:max(16px,4cqw);line-height:1.4;text-align:right;direction:rtl;outline:none;appearance:none;-webkit-appearance:none}
.mk-name:focus-visible{box-shadow:inset 0 0 0 2px #253d30}
.mk-opt{position:absolute;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mk-opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.mk-opt:has(input:focus-visible){outline:2px solid rgba(37,61,48,.55);outline-offset:-3px}
.mk-set:disabled .mk-opt,.mk-set:disabled .mk-opt input{cursor:default}
.mk-mark{position:absolute;background:#253d30;pointer-events:none;transform:scale(0);transition:transform .16s ease-out}
.mk-mark.on{transform:scale(1)}
.mk-dim{position:absolute;background:rgba(239,232,218,.74);opacity:0;pointer-events:none;transition:opacity .2s ease}
.mk-dim.on{opacity:1}
.mk-actions{padding-top:1.2%}
.mk-btn{display:flex;align-items:center;justify-content:center;width:67.48%;margin:0 auto;padding:3.2% 0;border:0;border-radius:0;background:#253d30;cursor:pointer;transition:opacity .2s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
.mk-btn:hover{opacity:.92}
.mk-btn:active{transform:scale(.992)}
.mk-btn:focus-visible{outline:2px solid #253d30;outline-offset:3px}
.mk-btn img{width:11.09%}
.mk-status{display:flex;align-items:center;justify-content:center;aspect-ratio:1310/170}
.mk-status img{animation:mk-in .25s ease-out}
@keyframes mk-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mk-mark,.mk-dim,.mk-btn{transition:none}.mk-status img{animation:none}}
</style>

    var el = form.querySelector('input[name="' + n + '"]:checked');
    return el ? el.value : "";
  }
  function setVal(n, v) {
    var els = form.querySelectorAll('input[name="' + n + '"]');
    for (var i = 0; i < els.length; i++) els[i].checked = els[i].value === v;
  }
  function show(k) {
    statusEl.textContent = "";
    if (!k) return;
    var m = MSG[k];
    var img = new Image();
    img.src = m[0]; img.width = m[1]; img.height = m[2]; img.alt = m[3];
    img.style.width = (m[1] / 1310 * 100) + "%";
    statusEl.appendChild(img);
  }
  function paint() {
    var att = val("att");
    if (att === "no") setVal("plus", "");
    var plus = val("plus");
    var marks = form.querySelectorAll(".mk-mark");
    for (var i = 0; i < marks.length; i++) {
      var m = marks[i].getAttribute("data-m");
      marks[i].classList.toggle("on", m === "att-" + att || m === "plus-" + plus);
    }
    plusSet.disabled = att === "no";
    dim.classList.toggle("on", att === "no");
  }

  try {
    var s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s) {
      if (typeof s.name === "string") nameEl.value = s.name;
      if (s.att === "yes" || s.att === "no") setVal("att", s.att);
      if (s.plus === "yes" || s.plus === "no") setVal("plus", s.plus);
    }
  } catch (e) {}
  paint();

  form.addEventListener("change", function () { paint(); show(""); });
  nameEl.addEventListener("input", function () { show(""); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = nameEl.value.replace(/\s+/g, " ").trim();
    var att = val("att"), plus = val("plus");
    if (name.length < 2) return show("err_name");
    if (!att) return show("err_att");
    if (att === "yes" && !plus) return show("err_plus");
    try { localStorage.setItem(KEY, JSON.stringify({ name: name, att: att, plus: plus })); } catch (e2) {}
    var lines = [
      "پاسخ به دعوت‌نامهٔ «مخمل» | کاردل هوم",
      "۲۱ مهر ۱۴۰۵، ساعت ۲۰:۰۰",
      "",
      "نام و نام خانوادگی: " + name,
      "حضور: " + (att === "yes" ? "بله" : "خیر")
    ];
    if (att === "yes") lines.push("همراه (+۱): " + (plus === "yes" ? "بله" : "خیر"));
    var num = String(WHATSAPP_NUMBER || "").replace(/\D/g, "");
    var url = "https://wa.me/" + num + "?text=" + encodeURIComponent(lines.join("\n"));
    show("wa");
    window.location.href = url;
  });
})();
</script>
</body>
</html>
